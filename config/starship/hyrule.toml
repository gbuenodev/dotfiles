# Two-line prompt inspired by the oh-my-zsh "gnzh" theme.
# Same layout on every host (kokiri.toml, hyrule.toml); only the palette at the end differs.
add_newline = false
format = """
╭─$username$hostname $directory$git_branch$git_status
╰─$character"""
right_format = "$cmd_duration$status"
palette = "hyrule_field"

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold person"

[hostname]
ssh_only = false
format = "@[$hostname]($style)"
style = "bold person"

[directory]
style = "bold path"
truncate_to_repo = false
truncation_length = 100

[git_branch]
format = "[‹$branch›]($style)"
style = "bold branch"

[character]
success_symbol = "[➤](bold person)"
error_symbol = "[➤](bold red)"

# Exit code of the last command, on the right (disabled by default)
[status]
disabled = false
format = "[$status ↵]($style)"

# Hyrule Field
[palettes.hyrule_field]
person = "#e6c35c" # gold: the Triforce
path = "#7fb35a"   # grass green: the open field
branch = "#87b6d9" # sky blue: the sky over the field
